import com.android.build.api.artifact.SingleArtifact
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.KeyStore
import java.security.MessageDigest
import java.security.cert.X509Certificate

plugins {
    id 'com.android.application'
}

def localSigning = new Properties()
def localSigningFile = rootProject.file('keys/release.properties')
if (localSigningFile.isFile()) {
    localSigningFile.withReader('UTF-8') { localSigning.load(it) }
}
def signingEnvironment = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
// An environment variable that exists but holds an empty string is still "present" to Gradle,
// and shells such as PowerShell 7 leave empty variables behind when asked to clear them.
// Treat blank as absent so a half-cleared environment cannot hijack the signing source.
def environmentValue = { String name ->
    def value = providers.environmentVariable(name).orNull
    (value != null && !value.trim().isEmpty()) ? value : null
}
def useEnvironmentSigning = environmentValue('CI') == 'true' ||
        signingEnvironment.any { environmentValue(it) != null }
def signingValue = { String environmentName, String propertyName ->
    useEnvironmentSigning ? environmentValue(environmentName) : localSigning.getProperty(propertyName)
}
def storePath = signingValue('ANDROID_KEYSTORE_FILE', 'storeFile')
def storePasswordValue = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def aliasValue = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def keyPasswordValue = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def releaseStore = storePath ? rootProject.file(storePath) : null
def signingComplete = releaseStore != null && [storePasswordValue, aliasValue, keyPasswordValue].every { it != null && !it.trim().isEmpty() }

android {
    namespace = 'com.sxrec.xunibtn'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.sxrec.xunibtn'
        minSdk = 33
        targetSdk = 34
        versionCode = rootProject.ext.appVersionCode
        versionName = rootProject.ext.appVersionName
        buildConfigField 'String', 'REPOSITORY_URL', '"' + rootProject.ext.repositoryUrl + '"'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (signingComplete) {
            create('release') {
                storeFile = releaseStore
                storePassword = storePasswordValue
                keyAlias = aliasValue
                keyPassword = keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            if (signingComplete) {
                signingConfig = signingConfigs.getByName('release')
            }
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

// VERSION_NAME is generated by AGP from defaultConfig.versionName.
def verifySigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Refuse unsigned releases and Android debug signing keys.'
    doLast {
        if (!signingComplete || !releaseStore.isFile()) {
            throw new GradleException('Release signing is required. Use keys/release.properties locally or configure the four ANDROID_* GitHub Secrets in CI. Debug builds do not require release credentials.')
        }
        try {
            def store = KeyStore.getInstance(releaseStore, storePasswordValue.toCharArray())
            if (!store.isKeyEntry(aliasValue) || store.getKey(aliasValue, keyPasswordValue.toCharArray()) == null) {
                throw new IllegalStateException('Missing private key')
            }
            def certificate = store.getCertificate(aliasValue)
            def subject = certificate instanceof X509Certificate ? certificate.subjectX500Principal.name : ''
            if (aliasValue.equalsIgnoreCase('androiddebugkey') || subject.toLowerCase(Locale.ROOT).contains('cn=android debug')) {
                throw new IllegalStateException('Debug certificate')
            }
        } catch (Exception ignored) {
            throw new GradleException('Invalid release keystore, alias or passwords, or an Android debug key was supplied. Check the private signing configuration.')
        }
    }
}

// The gate also covers direct packaging/bundle invocations, not only the menu.
tasks.configureEach {
    if (name in ['preReleaseBuild', 'packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']) {
        dependsOn verifySigning
    }
}

abstract class ExportApk extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getApkDirectory()

    @OutputFile
    abstract RegularFileProperty getApkFile()

    @OutputFile
    abstract RegularFileProperty getChecksumFile()

    @TaskAction
    void exportApk() {
        def candidates = apkDirectory.get().asFile.listFiles().findAll { it.isFile() && it.name.endsWith('.apk') }
        if (candidates.size() != 1) {
            throw new GradleException('Expected exactly one APK; refusing to export an ambiguous or missing artifact.')
        }
        def destination = apkFile.get().asFile
        Files.createDirectories(destination.parentFile.toPath())
        Files.copy(candidates[0].toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
        def digest = MessageDigest.getInstance('SHA-256')
        destination.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int length
            while ((length = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, length)
            }
        }
        checksumFile.get().asFile.setText(digest.digest().encodeHex().toString() + '  ' + destination.name + '\n', 'UTF-8')
        logger.lifecycle('APK: {}', destination)
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def capitalized = variant.name.capitalize()
        def suffix = variant.buildType == 'release' ? '' : '-debug'
        def apkName = "xuniBTN-v${rootProject.ext.appVersionName}${suffix}.apk"
        def exportTask = tasks.register("export${capitalized}Apk", ExportApk) {
            group = 'distribution'
            description = "Build and export the ${variant.name} APK and SHA256 to out_put."
            apkDirectory.set(variant.artifacts.get(SingleArtifact.APK.INSTANCE))
            apkFile.set(rootProject.layout.projectDirectory.file("out_put/${apkName}"))
            checksumFile.set(rootProject.layout.projectDirectory.file("out_put/${apkName}.sha256"))
            if (variant.buildType == 'release') {
                dependsOn verifySigning
            }
        }
        // Direct assemble invocations and the local menu share the same outputs.
        tasks.matching { it.name == "assemble${capitalized}" }.configureEach {
            finalizedBy exportTask
        }
    }
}
